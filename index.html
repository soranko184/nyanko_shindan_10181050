<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>にゃんこ大戦争 MBTI診断</title>
<style>
  :root {
    --bg: #0f1219;
    --bg-card: #181d29;
    --bg-sub: #22293a;
    --border: #2e3850;
    --text: #f3f5fa;
    --text-muted: #9aa6be;
    --gold: #f5b942;
    --gold-dark: #d8961e;
    --nt: #9b6dff;
    --nt-bg: rgba(155, 109, 255, 0.14);
    --nf: #2ecc8f;
    --nf-bg: rgba(46, 204, 143, 0.14);
    --sj: #3ea6ff;
    --sj-bg: rgba(62, 166, 255, 0.14);
    --sp: #ff9c38;
    --sp-bg: rgba(255, 156, 56, 0.14);
    --radius: 16px;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    background: radial-gradient(circle at top, #1b2234 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(15, 18, 25, 0.88);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }

  .header-inner {
    max-width: 720px;
    margin: 0 auto;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    font-size: 0.98rem;
    letter-spacing: 0.02em;
    cursor: pointer;
    user-select: none;
  }

  .brand-badge {
    background: linear-gradient(135deg, var(--gold), #ff8f2b);
    color: #161616;
    font-size: 0.72rem;
    font-weight: 900;
    padding: 2px 7px;
    border-radius: 999px;
  }

  .sound-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-sub);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    white-space: nowrap;
  }

  .sound-btn:hover {
    border-color: var(--gold);
  }

  .sound-btn:active {
    transform: scale(0.96);
  }

  .sound-btn.off {
    color: var(--text-muted);
    opacity: 0.8;
  }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 14px 14px 40px;
  }

  main.is-title-mode {
    padding: 10px 10px 20px;
  }

  .screen {
    display: none;
    animation: fadeIn 0.25s ease;
  }

  .screen.active {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== タイトル画面（縦長タイトル画像＋ボタンホットスポット） ===== */
  .title-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .title-stage {
    position: relative;
    width: min(100%, 440px, calc((100dvh - 82px) * 640 / 1147));
    aspect-ratio: 640 / 1147;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.65), 0 0 0 2px rgba(245, 185, 66, 0.35);
    background: #f5b942;
    user-select: none;
  }

  .title-bg-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }

  /* 画像内の「しんだんスタート」「おぷしょん」ボタン座標に厳密一致 */
  .title-hotspot {
    position: absolute;
    left: 25.20%;
    width: 49.61%;
    border: none;
    padding: 0;
    margin: 0;
    background: transparent;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.14s ease, box-shadow 0.14s ease, transform 0.08s ease;
    outline: none;
  }

  .title-hotspot:hover {
    background: rgba(255, 255, 255, 0.16);
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.7), 0 6px 18px rgba(0, 0, 0, 0.35);
  }

  .title-hotspot:focus-visible {
    box-shadow: 0 0 0 3px #ffffff, 0 0 0 6px #181d29;
  }

  .title-hotspot:active {
    background: rgba(0, 0, 0, 0.18);
    transform: translateY(2px) scale(0.985);
  }

  .hotspot-start {
    top: 45.17%;
    height: 5.20%;
    animation: pulseGlow 2.4s ease-in-out infinite;
  }

  .hotspot-option {
    top: 51.82%;
    height: 5.23%;
  }

  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
    50% { box-shadow: 0 0 14px 2px rgba(255, 255, 255, 0.48); }
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* ===== カード共通 ===== */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 20px;
    box-shadow: var(--shadow);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 14px 18px;
    border-radius: 12px;
    border: none;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.1s, filter 0.15s, background 0.15s, border-color 0.15s;
    text-decoration: none;
  }

  .btn:active {
    transform: scale(0.98);
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--gold), #ff9830);
    color: #141414;
    box-shadow: 0 6px 18px rgba(245, 185, 66, 0.28);
  }

  .btn-primary:hover {
    filter: brightness(1.06);
  }

  .btn-secondary {
    background: var(--bg-sub);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover {
    border-color: var(--gold);
  }

  .btn-stack {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  /* Quiz Screen */
  .quiz-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    font-size: 0.86rem;
    color: var(--text-muted);
  }

  .quiz-progress-text {
    font-weight: 800;
    color: var(--gold);
    font-size: 0.95rem;
  }

  .quiz-cat {
    background: var(--bg-sub);
    border: 1px solid var(--border);
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.76rem;
    color: var(--text);
  }

  .progress-track {
    width: 100%;
    height: 8px;
    background: var(--bg-sub);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 22px;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--gold), #ff8f2b);
    border-radius: 999px;
    transition: width 0.28s ease;
  }

  .question-box {
    min-height: 92px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 1.16rem;
    font-weight: 700;
    line-height: 1.55;
    margin-bottom: 22px;
    padding: 8px 4px;
  }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 18px;
  }

  .choice-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 14px 16px;
    background: var(--bg-sub);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 0.96rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.14s ease;
    text-align: left;
  }

  .choice-btn:hover {
    border-color: var(--gold);
    background: #283146;
  }

  .choice-btn:active {
    transform: scale(0.985);
  }

  .choice-btn.selected {
    border-color: var(--gold);
    background: rgba(245, 185, 66, 0.16);
  }

  .choice-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .quiz-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding-top: 6px;
    border-top: 1px solid var(--border);
  }

  .link-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 0.86rem;
    font-weight: 700;
    padding: 8px 6px;
    cursor: pointer;
  }

  .link-btn:hover {
    color: var(--text);
  }

  .link-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  /* Result Screen */
  .result-hero {
    text-align: center;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }

  .group-pill {
    display: inline-block;
    font-size: 0.78rem;
    font-weight: 800;
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 14px;
  }

  .result-avatar {
    width: 148px;
    height: 148px;
    margin: 0 auto 14px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 3px solid currentColor;
    overflow: hidden;
    padding: 4px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.42);
  }

  .result-avatar img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .result-type-code {
    font-size: 2.1rem;
    font-weight: 900;
    letter-spacing: 0.08em;
    line-height: 1.1;
    margin: 0;
  }

  .result-char-name {
    font-size: 1.32rem;
    font-weight: 800;
    margin: 6px 0 4px;
  }

  .result-title {
    font-size: 0.96rem;
    font-weight: 700;
    color: var(--gold);
    margin: 0;
  }

  .section-block {
    margin-bottom: 20px;
  }

  .section-heading {
    font-size: 0.84rem;
    font-weight: 800;
    color: var(--text-muted);
    letter-spacing: 0.04em;
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .desc-text {
    margin: 0;
    font-size: 0.96rem;
    line-height: 1.72;
  }

  .aruaru-box {
    background: var(--bg-sub);
    border-left: 4px solid var(--gold);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 0.95rem;
    font-weight: 600;
    line-height: 1.65;
  }

  /* Axis Bars */
  .axis-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .axis-row {
    background: var(--bg-sub);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
  }

  .axis-labels {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .axis-labels .win {
    color: var(--gold);
  }

  .axis-bar-bg {
    height: 8px;
    background: #121722;
    border-radius: 999px;
    overflow: hidden;
    display: flex;
  }

  .axis-bar-left {
    height: 100%;
    transition: width 0.4s ease;
  }

  .axis-bar-right {
    height: 100%;
    transition: width 0.4s ease;
  }

  /* Compatibility & Dex Cards */
  .compat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .compat-card {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-sub);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px;
    cursor: pointer;
    text-align: left;
    color: var(--text);
    transition: border-color 0.15s, transform 0.1s;
    width: 100%;
  }

  .compat-card:hover {
    border-color: var(--gold);
  }

  .compat-card:active {
    transform: scale(0.98);
  }

  .mini-thumb {
    width: 56px;
    height: 56px;
    flex-shrink: 0;
    border-radius: 10px;
    border: 1.5px solid currentColor;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2px;
  }

  .mini-thumb img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .card-text-wrap {
    min-width: 0;
    flex: 1;
  }

  .compat-code {
    font-size: 0.98rem;
    font-weight: 900;
    line-height: 1.2;
  }

  .compat-char {
    font-size: 0.84rem;
    font-weight: 700;
    margin-top: 2px;
    line-height: 1.3;
  }

  .compat-sub {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-top: 2px;
    line-height: 1.3;
  }

  /* Share Section */
  .share-box {
    background: var(--bg-sub);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
  }

  .tab-bar {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 10px;
  }

  .tab-btn {
    background: #141925;
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    font-size: 0.84rem;
    font-weight: 800;
    cursor: pointer;
  }

  .tab-btn.active {
    background: rgba(245, 185, 66, 0.18);
    color: var(--gold);
    border-color: var(--gold);
  }

  .url-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.82rem;
    color: var(--text-muted);
    margin-bottom: 10px;
    cursor: pointer;
    user-select: none;
  }

  .share-preview {
    background: #111520;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    font-size: 0.84rem;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.55;
    color: #e6ebf5;
    margin-bottom: 12px;
    font-family: inherit;
  }

  .btn-x {
    background: #000000;
    color: #ffffff;
    border: 1px solid #3c4558;
  }

  .btn-x:hover {
    background: #1a1a1a;
    border-color: #ffffff;
  }

  /* Option Modal Items */
  .opt-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--bg-sub);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }

  .opt-title {
    font-weight: 800;
    font-size: 0.96rem;
  }

  .opt-desc {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .opt-info-box {
    background: var(--bg-sub);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 0.85rem;
    color: var(--text-muted);
    line-height: 1.65;
  }

  .opt-info-box strong {
    color: var(--text);
  }

  /* Group color utilities */
  .grp-NT { color: var(--nt); }
  .grp-NF { color: var(--nf); }
  .grp-SJ { color: var(--sj); }
  .grp-SP { color: var(--sp); }

  .pill-NT { background: var(--nt-bg); color: var(--nt); border: 1px solid rgba(155,109,255,0.4); }
  .pill-NF { background: var(--nf-bg); color: var(--nf); border: 1px solid rgba(46,204,143,0.4); }
  .pill-SJ { background: var(--sj-bg); color: var(--sj); border: 1px solid rgba(62,166,255,0.4); }
  .pill-SP { background: var(--sp-bg); color: var(--sp); border: 1px solid rgba(255,156,56,0.4); }

  .avatar-NT { background: var(--nt-bg); color: var(--nt); }
  .avatar-NF { background: var(--nf-bg); color: var(--nf); }
  .avatar-SJ { background: var(--sj-bg); color: var(--sj); }
  .avatar-SP { background: var(--sp-bg); color: var(--sp); }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(5, 7, 12, 0.78);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }

  .modal-backdrop.open {
    display: flex;
  }

  .modal-panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 100%;
    max-width: 660px;
    max-height: 86vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    font-weight: 800;
  }

  .modal-close {
    background: var(--bg-sub);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 11px;
    font-weight: 800;
    cursor: pointer;
  }

  .modal-body {
    padding: 16px 18px 22px;
    overflow-y: auto;
  }

  .dex-group-title {
    font-size: 0.84rem;
    font-weight: 800;
    margin: 14px 0 8px;
  }

  .dex-group-title:first-child {
    margin-top: 0;
  }

  .dex-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  .dex-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-sub);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 9px 10px;
    cursor: pointer;
    text-align: left;
    color: var(--text);
    transition: border-color 0.15s;
    width: 100%;
  }

  .dex-item:hover {
    border-color: var(--gold);
  }

  /* Toast */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(20px);
    background: #1f293d;
    color: #fff;
    border: 1px solid var(--gold);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 0.88rem;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 200;
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 520px) {
    .question-box { font-size: 1.04rem; }
    .dex-grid, .compat-grid, .btn-row { grid-template-columns: 1fr; }
    .card { padding: 20px 16px; }
    .title-stage {
      width: min(100%, calc((100dvh - 72px) * 640 / 1147));
      border-radius: 14px;
    }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand" id="brandHome" title="タイトルへ戻る">
      <span>🐾 にゃんこMBTI診断</span>
      <span class="brand-badge">16TYPE</span>
    </div>
    <button type="button" class="sound-btn" id="soundToggleBtn" aria-pressed="true">
      <span id="soundIcon">🔊</span>
      <span id="soundLabel">効果音ON</span>
    </button>
  </div>
</header>

<main id="mainContainer" class="is-title-mode">
  <!-- タイトル画面（縦長タイトル画像＋インタラクティブボタン） -->
  <section id="screenStart" class="screen active">
    <div class="title-wrapper">
      <div class="title-stage">
        <img class="title-bg-img" id="titleBgImg" alt="にゃんこ大戦争 MBTI診断 タイトル画面">
        <button type="button" class="title-hotspot hotspot-start" id="startBtn" aria-label="しんだんスタート">
          <span class="sr-only">しんだんスタート</span>
        </button>
        <button type="button" class="title-hotspot hotspot-option" id="optionBtn" aria-label="おぷしょん">
          <span class="sr-only">おぷしょん</span>
        </button>
      </div>
    </div>
  </section>

  <!-- 質問画面 -->
  <section id="screenQuiz" class="screen">
    <div class="card">
      <div class="quiz-meta">
        <span class="quiz-progress-text" id="quizProgressText">Q1 / 12</span>
        <span class="quiz-cat" id="quizCatBadge">カテゴリ</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="question-box" id="questionText"></div>

      <div class="choices" id="choicesWrap">
        <button type="button" class="choice-btn" data-val="2">
          <span>強くそう思う</span>
          <span class="choice-dot" style="background:#f5b942;"></span>
        </button>

  function showScreen(target) {
    [screenStart, screenQuiz, screenResult].forEach(s => s.classList.remove('active'));
    target.classList.add('active');
    mainContainer.classList.toggle('is-title-mode', target === screenStart);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildQuizSet() {
    const picked = [];
    for (let g = 1; g <= 12; g++) {
      const candidates = QUESTIONS.filter(q => q.group === g);
      const chosen = candidates[Math.floor(Math.random() * candidates.length)];
      picked.push(chosen);
    }
    return shuffle(picked);
  }

  function startQuiz() {
    soundManager.playStart();
    activeQuestions = buildQuizSet();
    answers = new Array(activeQuestions.length).fill(null);
    currentIndex = 0;
    renderQuestion();
    showScreen(screenQuiz);
  }

  function renderQuestion() {
    const q = activeQuestions[currentIndex];
    const num = currentIndex + 1;
    quizProgressText.textContent = `Q${num} / ${activeQuestions.length}`;
    quizCatBadge.textContent = q.cat;
    progressFill.style.width = `${(num / activeQuestions.length) * 100}%`;
    questionText.textContent = q.text;

    const currentVal = answers[currentIndex];
    choiceBtns.forEach(btn => {
      const val = Number(btn.dataset.val);
      btn.classList.toggle('selected', currentVal === val);
    });
    prevBtn.disabled = currentIndex === 0;
  }

  function handleAnswer(val) {
    answers[currentIndex] = val;
    if (currentIndex < activeQuestions.length - 1) {
      soundManager.playClick();
      currentIndex++;
      renderQuestion();
    } else {
      computeAndShowResult();
    }
  }

  function computeAndShowResult() {
    const axes = {
      EI: { sum: 0, posCount: 0, left: 'E', right: 'I', leftName: 'E 外向・共有派', rightName: 'I 内向・単独派', colorL: '#f5b942', colorR: '#6c8eff' },
      SN: { sum: 0, posCount: 0, left: 'S', right: 'N', leftName: 'S 感覚・堅実派', rightName: 'N 直感・ロマン派', colorL: '#3ea6ff', colorR: '#9b6dff' },
      TF: { sum: 0, posCount: 0, left: 'T', right: 'F', leftName: 'T 思考・効率派', rightName: 'F 感情・キャラ愛派', colorL: '#ff9c38', colorR: '#2ecc8f' },
      JP: { sum: 0, posCount: 0, left: 'J', right: 'P', leftName: 'J 判断・計画派', rightName: 'P 知覚・柔軟派', colorL: '#4fd1c5', colorR: '#f687b3' }
    };

    activeQuestions.forEach((q, idx) => {
      const v = answers[idx];
      axes[q.axis].sum += v;
      if (v > 0) axes[q.axis].posCount += 1;
    });

    let code = '';
    const stats = [];
    ['EI', 'SN', 'TF', 'JP'].forEach(key => {
      const a = axes[key];
      const isLeft = a.sum > 0 || (a.sum === 0 && a.posCount >= 2);
      code += isLeft ? a.left : a.right;
      let leftPct = Math.round(((a.sum + 6) / 12) * 100);
      if (leftPct === 50) leftPct = isLeft ? 54 : 46;
      stats.push({
        key,
        leftName: a.leftName,
        rightName: a.rightName,
        leftPct,
        rightPct: 100 - leftPct,
        isLeft,
        colorL: a.colorL,
        colorR: a.colorR
      });
    });

    currentResultCode = code;
    renderResult(code, stats);
    showScreen(screenResult);
    soundManager.playResult();
  }

  function renderResult(code, stats) {
    const t = TYPES[code];

    const pill = document.getElementById('resGroupPill');
    pill.textContent = t.groupName;
    pill.className = `group-pill pill-${t.group}`;

    const avatar = document.getElementById('resAvatar');
    avatar.className = `result-avatar avatar-${t.group}`;
    avatar.innerHTML = getCharImgHtml(t.code);

    const codeEl = document.getElementById('resCode');
    codeEl.textContent = t.code;
    codeEl.className = `result-type-code grp-${t.group}`;

    document.getElementById('resChar').textContent = t.char;
    document.getElementById('resTitle').textContent = `《${t.title}》`;
    document.getElementById('resDesc').textContent = t.desc;
    document.getElementById('resAruaru').textContent = t.aruaru;

    const axesWrap = document.getElementById('resAxes');
    axesWrap.innerHTML = stats.map(s => `
      <div class="axis-row">
        <div class="axis-labels">
          <span class="${s.isLeft ? 'win' : ''}">${s.leftName} ${s.leftPct}%</span>
          <span class="${!s.isLeft ? 'win' : ''}">${s.rightPct}% ${s.rightName}</span>
        </div>
        <div class="axis-bar-bg">
          <div class="axis-bar-left" style="width:${s.leftPct}%; background:${s.colorL};"></div>
          <div class="axis-bar-right" style="width:${s.rightPct}%; background:${s.colorR};"></div>
        </div>
      </div>
    `).join('');

    const compatWrap = document.getElementById('resCompat');
    compatWrap.innerHTML = t.compat.map(cCode => {

    });

  function buildShareText() {
    if (!currentResultCode) return '';
    const t = TYPES[currentResultCode];
    const includeUrl = document.getElementById('includeUrlCheck').checked;
    const isHttp = /^https?:\/\//.test(window.location.href);
    const urlLine = (includeUrl && isHttp) ? `\n${window.location.href}` : '';

    if (shareMode === 'x') {
      return `【にゃんこMBTI診断】\n${t.code}｜${t.char}\n《${t.title}》\n💬${t.aruaru}\n🤝好相性：${t.compat.join(' / ')}\n#にゃんこ大戦争 #にゃんこMBTI${urlLine}`;

      return `**【にゃんこMBTI診断】**\n**${t.code}｜${t.char}**\n《${t.title}》\n💬 ${t.aruaru}\n🤝 好相性：${t.compat.join(' / ')}（同じタイプや好相性の人いる？）${urlLine}`;

  }

  let toastTimer = null;

  async function copyShareText() {
    soundManager.playClick();
    const text = buildShareText();
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      showToast('診断結果をコピーしました！');
    } catch (e) {
      showToast('コピーに失敗しました。長押しで選択してください。');
    }
  }

    ['NT', 'NF', 'SJ', 'SP'].forEach(gk => {
      const g = GROUP_META[gk];
      html += `<div class="dex-group-title grp-${gk}">${g.name}</div><div class="dex-grid">`;
      g.codes.forEach(code => {
        const t = TYPES[code];
        html += `
          <button type="button" class="dex-item" data-dex-code="${t.code}">
            <div class="mini-thumb avatar-${t.group}">${getCharImgHtml(t.code)}</div>
            <div class="card-text-wrap">
              <div class="compat-code grp-${t.group}">${t.code}</div>
              <div class="compat-char">${t.char}</div>
              <div class="compat-sub">《${t.title}》</div>
            </div>
          </button>
        `;
      });
      html += '</div>';
    });
    modalBody.innerHTML = html;
    modalBody.querySelectorAll('[data-dex-code]').forEach(btn => {
      btn.addEventListener('click', () => {
        soundManager.playClick();
        openTypeDetailModal(btn.dataset.dexCode, true);
      });
    });
    modalBackdrop.classList.add('open');
  }

  function openTypeDetailModal(code, fromDex) {
    const t = TYPES[code];
    modalTitle.textContent = `${t.code}｜${t.char}`;
    modalBody.innerHTML = `
      <div style="text-align:center; margin-bottom:16px;">
        <div class="group-pill pill-${t.group}">${t.groupName}</div>
        <div class="result-avatar avatar-${t.group}" style="width:132px; height:132px;">
          ${getCharImgHtml(t.code)}
        </div>
        <div class="result-type-code grp-${t.group}" style="font-size:1.65rem;">${t.code}</div>
        <div class="result-char-name" style="font-size:1.15rem;">${t.char}</div>
        <div class="result-title">《${t.title}》</div>
      </div>
      <div class="section-block">
        <div class="section-heading">📝 プレイスタイル解説</div>
        <p class="desc-text">${t.desc}</p>
      </div>
      <div class="section-block">
        <div class="section-heading">💬 一言あるある</div>
        <div class="aruaru-box">${t.aruaru}</div>
      </div>
      <div class="section-block" style="margin-bottom:${fromDex ? '14px' : '0'};">
        <div class="section-heading">🤝 好相性タイプ</div>
        <div class="compat-grid">
          ${t.compat.map(cc => {
            const ct = TYPES[cc];
            return `
              <button type="button" class="compat-card" data-detail-jump="${ct.code}">
                <div class="mini-thumb avatar-${ct.group}">${getCharImgHtml(ct.code)}</div>
                <div class="card-text-wrap">
                  <div class="compat-code grp-${ct.group}">${ct.code}</div>
                  <div class="compat-char">${ct.char}</div>
                </div>
              </button>`;
          }).join('')}
        </div>
      </div>
      ${fromDex ? '<button type="button" class="btn btn-secondary" id="backToDexBtn">← 全16タイプ一覧に戻る</button>' : ''}
    `;
    modalBody.querySelectorAll('[data-detail-jump]').forEach(btn => {
      btn.addEventListener('click', () => {
        soundManager.playClick();
        openTypeDetailModal(btn.dataset.detailJump, fromDex);
      });
    });
    const backBtn = document.getElementById('backToDexBtn');
    if (backBtn) {
      backBtn.addEventListener('click', () => {
        soundManager.playClick();
        openDexModal();
      });
    }
    modalBackdrop.classList.add('open');
  }

  function closeModal() {
    modalBackdrop.classList.remove('open');
  }

  // ===== イベント紐付け =====
  soundToggleBtn.addEventListener('click', () => {
    soundManager.toggle();
    updateSoundBtnUI();
  });

  document.getElementById('brandHome').addEventListener('click', () => {
    soundManager.playClick();
    showScreen(screenStart);
  });

  document.getElementById('startBtn').addEventListener('click', startQuiz);
  document.getElementById('retryBtn').addEventListener('click', startQuiz);

  document.getElementById('optionBtn').addEventListener('click', () => {
    soundManager.playClick();
    openOptionModal();
  });

  choiceBtns.forEach(btn => {
    btn.addEventListener('click', () => handleAnswer(Number(btn.dataset.val)));
  });

  prevBtn.addEventListener('click', () => {
    if (currentIndex > 0) {
      soundManager.playClick();
      currentIndex--;
      renderQuestion();
    }
  });

  document.getElementById('quitBtn').addEventListener('click', () => {
    soundManager.playClick();
    showScreen(screenStart);
  });

  document.getElementById('openDexFromResBtn').addEventListener('click', () => {
    soundManager.playClick();
    openDexModal();
  });

  document.getElementById('backTitleFromResBtn').addEventListener('click', () => {
    soundManager.playClick();
    showScreen(screenStart);
  });

  document.getElementById('tabX').addEventListener('click', () => {
    soundManager.playClick();
    shareMode = 'x';
    document.getElementById('tabX').classList.add('active');
    document.getElementById('tabDiscord').classList.remove('active');
    updateSharePreview();
  });

  document.getElementById('tabDiscord').addEventListener('click', () => {
    soundManager.playClick();
    shareMode = 'discord';
    document.getElementById('tabDiscord').classList.add('active');
    document.getElementById('tabX').classList.remove('active');
    updateSharePreview();
  });

  document.getElementById('includeUrlCheck').addEventListener('change', () => {
    soundManager.playClick();
    updateSharePreview();
  });

  document.getElementById('copyShareBtn').addEventListener('click', copyShareText);
  document.getElementById('postXBtn').addEventListener('click', () => soundManager.playClick());

  document.getElementById('modalCloseBtn').addEventListener('click', () => {
    soundManager.playClick();
    closeModal();
  });

  modalBackdrop.addEventListener('click', (e) => {
    if (e.target === modalBackdrop) {
      soundManager.playClick();
      closeModal();
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modalBackdrop.classList.contains('open')) {
      closeModal();
    }
  });
})();
</script>
</body>
</html>
